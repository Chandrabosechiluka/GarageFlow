services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: garageflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Create a .env file with MSSQL_SA_PASSWORD (see .env.example)}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
