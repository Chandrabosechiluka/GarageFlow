server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # The browser talks only to this server; /api and /health are passed to the API container.
  # That keeps everything on one origin, so there is no CORS to configure.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /health {
    proxy_pass http://api:8080;
  }

  # Runtime settings must never be cached, or a changed apiBaseUrl would not take effect.
  location = /config.json {
    add_header Cache-Control "no-store";
  }

  # Hashed build files can be cached for a year.
  location ~* \.(js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Any other path is a screen inside the app: serve index.html and let the router decide.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
